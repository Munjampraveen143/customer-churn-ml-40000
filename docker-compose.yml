services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./prediction_history.db:/app/prediction_history.db

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    depends_on:
      - api
